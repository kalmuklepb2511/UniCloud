#working
spring.application.name=iamusers
server.port=8080

# UniCloud management database
spring.datasource.url=jdbc:mysql://localhost:3306/unicloud
spring.datasource.username=root
spring.datasource.password=balaji@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JAR upload directory
app.deployment.upload-dir=C:/unicloud-deployments

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Application database provisioning connection
unicloud.database.admin-url=jdbc:mysql://localhost:3306/mysql
unicloud.database.admin-username=${UNICLOUD_APP_DB_ADMIN_USERNAME:root}
unicloud.database.admin-password=${UNICLOUD_APP_DB_ADMIN_PASSWORD:balaji@123}










